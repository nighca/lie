<!doctype html><meta charset="utf-8"><title>LIE spacing QA</title><style>body{margin:16px;font:14px system-ui;background:#eee}header{margin-bottom:12px}section{display:flex;gap:16px;align-items:start}iframe{flex:none;height:844px;border:1px solid #888;background:white}pre{white-space:pre-wrap}</style><header>Actual iframe viewport: <select id="width"><option>391</option><option>320</option><option>620</option><option>621</option><option>1280</option></select> <button id="measure">Measure</button> <button id="bottom">Scroll candidate to bottom</button> Candidate left / baseline right (only mobile added margin disabled)</header><section><iframe id="candidate" src="/?demo=1" title="candidate"></iframe><iframe id="baseline" src="/?demo=1" title="baseline"></iframe></section><pre id="result"></pre><script>
const frames=[document.querySelector('#candidate'),document.querySelector('#baseline')];
function size(){for(const f of frames)f.style.width=document.querySelector('#width').value+'px'}
document.querySelector('#bottom').onclick=()=>{frames[0].contentWindow.scrollTo(0,100000);frames[0].contentDocument.querySelector('.case-grid').scrollTo(0,100000)};
size();document.querySelector('#width').onchange=size;
frames[1].onload=()=>{const s=frames[1].contentDocument.createElement('style');s.textContent='@media(max-width:620px){.home-cases{margin-top:0}}';frames[1].contentDocument.head.append(s)};
document.querySelector('#measure').onclick=()=>{document.querySelector('#result').textContent=JSON.stringify(frames.map(f=>{const w=f.contentWindow,d=f.contentDocument,r=s=>d.querySelector(s).getBoundingClientRect(),c=s=>w.getComputedStyle(d.querySelector(s));return {name:f.id,viewport:[w.innerWidth,w.innerHeight],scrollY:w.scrollY,listScrollTop:d.querySelector('.case-grid').scrollTop,flow:r('.home-flow').toJSON(),cases:r('.home-cases').toJSON(),heading:r('.home-cases h2').toJSON(),list:r('.case-grid').toJSON(),sectionGap:r('.home-cases').top-r('.home-flow').bottom,titleListGap:r('.case-grid').top-r('.home-cases h2').bottom,casesMarginTop:c('.home-cases').marginTop,document:{client:d.documentElement.clientHeight,scroll:d.documentElement.scrollHeight,width:d.documentElement.scrollWidth},listOverflow:c('.case-grid').overflowY,listScroll:d.querySelector('.case-grid').scrollHeight,listClient:d.querySelector('.case-grid').clientHeight}}),null,2)};
</script>
