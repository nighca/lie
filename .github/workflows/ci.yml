name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lie-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Cache pinned image tools and verified derivatives
        uses: actions/cache@v5
        with:
          path: tmp/image-build
          key: ${{ runner.os }}-${{ runner.arch }}-lie-images-v1-${{ hashFiles('apps/web/build/image-tools.mjs', 'apps/web/build/image-optimize.mjs', 'apps/web/build/image-codec.mjs') }}-${{ hashFiles('design/character-presets/assets/**/*.png') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lie-images-v1-${{ hashFiles('apps/web/build/image-tools.mjs', 'apps/web/build/image-optimize.mjs', 'apps/web/build/image-codec.mjs') }}-
      - name: Check CI/CD handoff guards
        run: node --test scripts/ci-release.test.mjs
      - run: npm run typecheck
      - name: Test with application and separate script coverage
        run: npm run coverage
      - name: Upload coverage reports and generated snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - run: npm run build
      - name: Validate production build without uploading
        run: npm exec --workspace @lie/gateway -- cf deploy --prebuilt --mode production --worker lie-game --provision=false --dry-run
      - name: Package verified production output
        if: github.repository == 'nighca/lie' && github.ref == 'refs/heads/main'
        run: node scripts/ci-release.mjs pack
      - name: Upload verified production build
        if: github.repository == 'nighca/lie' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/verified-build/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
