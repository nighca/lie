name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: lie-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CF_SEND_TELEMETRY: 'false'

jobs:
  verify:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Cache pinned image tools and verified derivatives
        uses: actions/cache@v5
        with:
          path: tmp/image-build
          key: ${{ runner.os }}-${{ runner.arch }}-lie-images-v1-${{ hashFiles('apps/web/build/image-tools.mjs', 'apps/web/build/image-optimize.mjs', 'apps/web/build/image-codec.mjs') }}-${{ hashFiles('design/character-presets/assets/**/*.png') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lie-images-v1-${{ hashFiles('apps/web/build/image-tools.mjs', 'apps/web/build/image-optimize.mjs', 'apps/web/build/image-codec.mjs') }}-
      - name: Check CI/CD handoff guards
        run: node --test scripts/ci-release.test.mjs
      - name: Check preview artifact and publisher boundaries
        run: node --test scripts/pr-preview*.test.mjs
      - run: npm run typecheck
      - name: Test with application and separate script coverage
        run: npm run coverage
      - name: Upload coverage reports and generated snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
      - run: npm run build
      - name: Validate production build without uploading
        run: npm exec --workspace @lie/gateway -- cf deploy --prebuilt --mode production --worker lie-game --provision=false --dry-run
      - name: Build the same PR Worker for Preview without credentials
        env:
          CLOUDFLARE_PREVIEW_BUILD: 'true'
          LIE_SHARE_BUCKET_NAME: lie-shared-games-dev
          LIE_VOICE_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
        run: npm exec --workspace @lie/gateway -- cf build --mode preview
      - name: Package the full PR frontend and Worker
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: node scripts/pr-preview-artifact.mjs pack
      - name: Upload the exact preview build
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/pr-preview-build/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  gate:
    if: always() && github.event.action != 'closed'
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every verification step to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success

  closed:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit a close signal without checking out PR code
        run: printf 'closed\n' > closed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview-closed-${{ github.event.pull_request.number }}
          path: closed.txt
          if-no-files-found: error
          retention-days: 1
