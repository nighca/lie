<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waiting visibility revision · pending acceptance</title>
<style>*{box-sizing:border-box}body{margin:16px;font:16px system-ui;background:#fff18a;color:#111b45}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.strip main{grid-template-columns:repeat(4,minmax(0,1fr))}.frame{position:relative;aspect-ratio:1;background:#fffef7;overflow:hidden;border:2px solid #111b45;border-radius:12px}canvas{display:block;width:100%}h2{font-size:16px}.detail .frame{height:330px;aspect-ratio:auto}.detail canvas{position:absolute;width:1254px;height:1254px;left:calc(50% - 627px);top:-250px}.waist canvas{top:-650px}.face canvas{top:0}@media(max-width:620px){main,.strip main{grid-template-columns:1fr}}</style>
<h1>waiting · 呼吸可见度修订（待用户验收）</h1><p>正式 sampler / Canvas；先旧版正负极值，再新版正负极值。32相位仅展示新版。头手同组，腰下固定。</p><nav><a href="?">极值对比</a> · <a href="?detail=shoulders">肩手接触</a> · <a href="?detail=waist">腰部</a> · <a href="?detail=face">发顶</a> · <a href="?samples=32">32相位</a></nav><main></main>
<script type="module">
import{readAnimationPackage,sampleClip,createCanvasRenderer}from '../../../packages/character-animation/src/index.ts'
const q=new URLSearchParams(location.search),detail=q.get('detail'),strip=q.get('samples')==='32';if(detail)document.body.classList.add('detail',detail);if(strip)document.body.classList.add('strip');
const current=readAnimationPackage(await(await fetch('./package.json')).json()),baseline=readAnimationPackage(await(await fetch('./archive/2026-10-25-waiting-visibility/baseline-package.json')).json());
const images=new Map(await Promise.all(Object.entries(current.assets).map(async([id,a])=>{const im=new Image();im.src=new URL(a.src,location.href);await im.decode();return[id,im]})));
const stages=strip?Array.from({length:32},(_,i)=>[current,i/32,'新版']):[[baseline,.25,'旧版'],[baseline,.75,'旧版'],[current,.25,'新版'],[current,.75,'新版']];
for(const[data,phase,label]of stages){const section=document.createElement('section'),h=document.createElement('h2'),frame=document.createElement('div'),canvas=document.createElement('canvas');h.textContent=label+' '+(phase*100).toFixed(2)+'%';frame.className='frame';frame.append(canvas);section.append(h,frame);document.querySelector('main').append(section);const clip=data.clips[data.states.waiting];createCanvasRenderer(canvas,data,images).render(sampleClip(data,clip,phase*clip.duration))}
</script>
