<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIE 首页 A 优化候选</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
<header><img class="logo" src="../../brand/logo.svg" alt="LIE"><span class="brand-label">语音推理</span></header>
<main>
<section class="introduction" aria-label="产品介绍">
<h1>有人，<br>有话没说完。</h1>
<p>和角色语音对话，<br>找出藏起真相的人。</p>
<div class="cast" aria-hidden="true"><div class="backdrop"></div><img class="sunny" src="../../appearances/assets/sunny-moustache.png" alt=""><img class="coral" src="../../appearances/assets/coral-bob.png" alt=""><img class="blue" src="../../appearances/assets/blue-glasses.png" alt=""><span class="spark first">✦</span><span class="spark second">✦</span></div>
</section>
<section class="cases" aria-labelledby="cases-title">
<div class="section-heading"><h2 id="cases-title">选择案件</h2></div>
<div class="case-list">

<article class="case pending"><div class="case-top"><span class="case-index">02</span><span class="budget">10 分钟询问时间</span></div><h3>压轴怎么是鸭叫</h3><p>木偶剧谢幕，压轴曲却变成了鸭叫。<br class="desktop-break">四个人，谁动了这段声音？</p><div class="case-action"><span class="draft-label">内容制作中 · 尚未上线</span></div></article>
</div>
</section>
</main>
</div>
</body></html>
