<!doctype html>
<html lang="en">
<!-- Export this original HTML/CSS composition at 1600x760 CSS pixels and DPR 1.
     English counterpart of readme-hero.html; the Chinese PNG keeps its existing path.
     Wait for document.fonts.ready and all four images to decode before viewport capture.
     2026-10-24 export: IAB native JPEG screenshot, converted to PNG with sips (no resize). -->
<meta charset="utf-8">
<title>LIE brand hero</title>
<style>*{box-sizing:border-box}
html,body{margin:0;background:#fff18a;color:#111b45;font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
.hero{position:relative;width:1600px;height:760px;overflow:hidden;background:#fff18a}
.brand{position:absolute;left:70px;top:190px;width:470px}
.logo{display:block;width:470px;height:251px}
.tagline{font-size:32px;font-weight:800;line-height:1.6;margin:20px 0 0 30px;white-space:nowrap}
.subtitle{font-size:20px;line-height:1.7;margin:12px 0 0 30px;color:#52607a;white-space:nowrap}
.cast{position:absolute;right:28px;top:100px;width:990px;height:660px;display:flex}
.character{position:relative;flex:1;overflow:hidden}
.character::before{content:'';position:absolute;width:310px;height:390px;left:50%;top:100px;transform:translateX(-50%) rotate(-5deg);border-radius:46% 54% 43% 48%;background:#78ddd7}
.character:nth-child(2)::before{background:#fffef7;transform:translateX(-50%) rotate(5deg)}
.character:nth-child(3)::before{background:#ffc5bd}
.character img{position:absolute;left:50%;top:0;transform:translateX(-50%);width:600px;height:600px;max-width:none}
.dot{position:absolute;width:18px;height:50px;border-radius:12px;background:#ff665b;transform:rotate(25deg)}
.dot.one{left:580px;top:118px}
.dot.two{right:56px;top:104px;background:#075bfa;transform:rotate(-25deg)}
.dot.three{left:580px;bottom:85px;background:#075bfa;height:18px;width:18px}</style>
<div class="hero" role="img" aria-label="LIE: ask questions, compare stories; bright yellow and blue with three original cartoon characters">
<div class="brand">
<img class="logo" src="logo.svg" alt="LIE">
<p class="tagline">Ask questions.<br>Compare stories.</p>
<p class="subtitle">A lighthearted voice mystery game in Chinese</p>
</div>
<div class="cast">
<div class="character">
<img src="../appearances/assets/coral-bob.png" alt="Coral-haired character">
</div>
<div class="character">
<img src="../appearances/assets/sunny-moustache.png" alt="Moustached character in yellow">
</div>
<div class="character">
<img src="../appearances/assets/blue-glasses.png" alt="Character with glasses in blue">
</div>
</div>
<span class="dot one">
</span>
<span class="dot two">
</span>
<span class="dot three">
</span>
</div>
</html>
