<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>连接提示三版设计 · 待确认</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e7;color:#111b45;font:16px/1.6 system-ui,-apple-system,'PingFang SC',sans-serif}main{max-width:1280px;padding:24px;margin:auto}h1{font-size:26px}.grid{display:flex;flex-wrap:wrap;gap:24px}.sample{padding:20px;background:#fff18a;border-radius:20px}.card{display:flex;align-items:center;gap:10px;color:#111b45}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:18px;line-height:25px}.copy small{display:block;font-size:13px;color:#52607a;line-height:18px}.card button{flex:none;min-height:44px;min-width:48px;color:inherit;background:transparent;font:600 14px system-ui;cursor:pointer}.ring{flex:none;width:18px;height:18px;border:2px solid #075bfa2e;border-top-color:#075bfa;border-right-color:#075bfa;border-radius:50%;animation:spin 1.1s linear infinite}.a{width:312px;min-height:68px;padding:10px 12px;border:2px solid #111b45;background:#fffef7;border-radius:16px;box-shadow:0 3px #111b451c}.a button{border:1.5px solid #9ba6bb;border-radius:12px}.b{width:328px;min-height:60px;padding:6px 12px;border:1.5px solid #96b4e3;background:#eaf2ff;border-radius:30px}.b .copy{font-size:15px;font-weight:650;white-space:nowrap}.b button{border:0;border-left:1px solid #9cb1d1;border-radius:0}.c{position:relative;width:296px;min-height:72px;padding:12px 10px;background:#fffef7f0;border:1.3px solid #a6b4c8;border-radius:18px;box-shadow:0 4px #111b451c}.c:before{content:'';position:absolute;left:0;top:15px;bottom:15px;width:3px;background:#075bfa;border-radius:2px}.c .copy strong{font-size:16px}.c button{border:0}.dots{display:flex;gap:3px;padding-left:5px}.dots i{width:5px;height:5px;border-radius:50%;background:#075bfa;animation:wait 1.2s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes spin{to{transform:rotate(1turn)}}@keyframes wait{0%,80%,100%{opacity:.35}40%{opacity:1}}@media(prefers-reduced-motion:reduce){.ring,.dots i{animation:none}.dots i{opacity:.7}}button:focus-visible{outline:3px solid #075bfa;outline-offset:3px}</style><main><h1>三版连接提示 · 待确认</h1><p>仅为动效与排版设计；没有真实连接状态，取消按钮不执行语音操作。</p><div class="grid">
<section class="sample"><h2>A · 奶油色（推荐）</h2><div class="card a" role="status"><span class="ring" aria-hidden="true"></span><div class="copy"><strong>正在连接…</strong><small>连好后再说话</small></div><button type="button" aria-label="取消连接">取消</button></div></section>
<section class="sample"><h2>B · 浅蓝紧凑条</h2><div class="card b" role="status"><span class="ring" aria-hidden="true"></span><span class="copy">正在连接，连好再说</span><button type="button" aria-label="取消连接">取消</button></div></section>
<section class="sample"><h2>C · 轻透浮层</h2><div class="card c" role="status"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><div class="copy"><strong>语音准备中</strong><small>接通后再开口</small></div><button type="button" aria-label="取消连接">取消</button></div></section></div><p>上下文与尺寸见 mobile-comparison.svg / desktop-comparison.svg。系统减少动态设置会停止装饰动画。</p></main></html>
